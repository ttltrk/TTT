<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQL Flashcard – AND</title>
<style>
  @page { size: 7.5cm 13cm; margin: 0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #e9e9e9; font-family: "Segoe UI", Arial, sans-serif; color: #1a1a1a; }

  .card {
    width: 7.5cm;
    height: 13cm;
    margin: 1cm auto;
    background: #fff;
    border: 1px solid #999;
    border-radius: 0.3cm;
    padding: 0.6cm 0.5cm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .card:last-child { page-break-after: auto; break-after: auto; }

  .label {
    font-size: 7pt;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #777;
    border-bottom: 1px solid #ccc;
    padding-bottom: 0.15cm;
    margin-bottom: 0.4cm;
  }

  /* Front */
  .front .subject {
    font-family: Consolas, "Courier New", monospace;
    font-size: 28pt;
    font-weight: 700;
    text-align: left;
    margin: 1.6cm 0 1cm;
    color: #1f4e79;
  }
  .front .content {
    font-size: 12pt;
    line-height: 1.5;
    text-align: left;
  }

  /* Back */
  .back pre {
    font-family: Consolas, "Courier New", monospace;
    font-size: 11pt;
    line-height: 1.55;
    background: #f4f6f8;
    border: 1px solid #d6dbe0;
    border-radius: 0.15cm;
    padding: 0.35cm;
    margin-top: 1.2cm;
    white-space: pre-wrap;
  }
  .kw { color: #1f4e79; font-weight: 700; }

  .footer { margin-top: auto; font-size: 7pt; color: #999; text-align: right; }

  @media print {
    html, body { background: #fff; }
    .card { margin: 0; border-radius: 0; border: 1px solid #999; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

  <!-- Page 1: front -->
  <section class="card front">
    <div class="label">SQL · Subject</div>
    <div class="subject">AND</div>
    <p class="content">The AND operator displays a record if all the conditions are TRUE.</p>
    <div class="footer">1 / 2</div>
  </section>

  <!-- Page 2: back -->
  <section class="card back">
    <div class="label">SQL · Example</div>
    <pre><span class="kw">SELECT</span> *
<span class="kw">FROM</span> Customers
<span class="kw">WHERE</span> Country = 'Spain'
  <span class="kw">AND</span> CustomerName
      <span class="kw">LIKE</span> 'G%';</pre>
    <div class="footer">2 / 2</div>
  </section>

</body>
</html>
